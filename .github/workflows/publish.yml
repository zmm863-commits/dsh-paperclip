name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22.x satisfies tsdown's engines (^22.18.0).
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        # Node 22.x ships npm 10.x, which does not support trusted
        # publishing; npm 11.x is required.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          # setup-node writes a placeholder NODE_AUTH_TOKEN into the
          # environment; unset it so npm uses trusted publishing (OIDC)
          # instead of falling back to a nonexistent token.
          unset NODE_AUTH_TOKEN
          npm publish --access public
